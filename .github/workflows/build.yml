  web:
    name: الرابط (HTML)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
      - run: cd dist/web && zip -qr ../../PDF-Library-Web.zip .
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/web }
      - uses: actions/upload-artifact@v4
        with: { name: webzip, path: PDF-Library-Web.zip }

  pages:
    name: نشر الرابط على GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: site }
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4

  windows:
    name: برنامج الكمبيوتر (Windows)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: web, path: desktop/web }
      - name: بناء exe
        working-directory: desktop
        shell: bash
        run: |
          rm -f web/admin.html web/sw.js web/download.html
          npm pkg set version=1.${{ github.run_number }}.0
          npm install --no-audit --no-fund
          npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/PDF-Library-Setup.exe
            desktop/dist/PDF-Library-Setup.exe.blockmap
            desktop/dist/PDF-Library-Portable.exe
            desktop/dist/latest.yml

  android:
    name: تطبيق أندرويد (APK)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/download-artifact@v4
        with: { name: web, path: mobile/www }
      - name: بناء apk
        working-directory: mobile
        run: |
          rm -f www/sw.js www/admin.html
          mkdir -p assets
          convert ../src/icon-512.png -resize 1024x1024 assets/icon-only.png || true
          cp assets/icon-only.png assets/icon-foreground.png || true
          convert -size 1024x1024 xc:'#14213d' assets/icon-background.png || true
          convert -size 2732x2732 xc:'#14213d' assets/splash.png || true
          cp assets/splash.png assets/splash-dark.png || true
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android || true
          cp MainActivity.java android/app/src/main/java/com/bls/pdflibrary/MainActivity.java
          echo 'apply from: "../../signing.gradle"' >> android/app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../PDF-Library.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: mobile/PDF-Library.apk }

  release:
    name: روابط التحميل
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: المكتبة المحمية — إصدار ${{ github.run_number }}
          make_latest: true
          files: |
            out/PDF-Library.apk
            out/PDF-Library-Setup.exe
            out/PDF-Library-Portable.exe
            out/PDF-Library-Setup.exe.blockmap
            out/latest.yml
            out/PDF-Library-Web.zip
